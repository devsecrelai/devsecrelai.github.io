<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Threat model system flow</title>
  <desc id="desc">A user sends a request to an API service. Validated data moves to an AI agent, then to customer records or an approved tool. Dashed boxes show public and protected trust boundaries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .label { font: 600 24px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #f8fafc; }
      .detail { font: 400 18px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #cbd5e1; }
      .boundary { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #c4b5fd; letter-spacing: 1px; }
      .flow { font: 600 16px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #a5f3fc; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="32" fill="#111827"/>
  <text x="64" y="76" class="label" font-size="30">Start with a data flow, then mark each trust boundary</text>
  <text x="64" y="110" class="detail">Every arrow is a question: who controls this data, and what validates it?</text>

  <rect x="262" y="154" width="364" height="330" rx="22" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="286" y="188" class="boundary">PUBLIC TRUST BOUNDARY</text>

  <rect x="674" y="154" width="462" height="330" rx="22" fill="none" stroke="#67e8f9" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="698" y="188" class="boundary">PROTECTED TRUST BOUNDARY</text>

  <g>
    <rect x="62" y="276" width="150" height="96" rx="18" fill="#312e81" stroke="#a78bfa" stroke-width="3"/>
    <text x="137" y="319" text-anchor="middle" class="label">User</text>
    <text x="137" y="347" text-anchor="middle" class="detail">untrusted input</text>
  </g>

  <g>
    <rect x="320" y="276" width="248" height="96" rx="18" fill="#312e81" stroke="#a78bfa" stroke-width="3"/>
    <text x="444" y="319" text-anchor="middle" class="label">API service</text>
    <text x="444" y="347" text-anchor="middle" class="detail">authenticate and validate</text>
  </g>

  <g>
    <rect x="730" y="226" width="180" height="96" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
    <text x="820" y="269" text-anchor="middle" class="label">AI agent</text>
    <text x="820" y="297" text-anchor="middle" class="detail">scoped actions</text>
  </g>

  <g>
    <rect x="958" y="226" width="132" height="96" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
    <text x="1024" y="269" text-anchor="middle" class="label">Tool</text>
    <text x="1024" y="297" text-anchor="middle" class="detail">allowlist</text>
  </g>

  <g>
    <rect x="838" y="356" width="210" height="88" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
    <text x="943" y="394" text-anchor="middle" class="label">Customer records</text>
    <text x="943" y="420" text-anchor="middle" class="detail">least privilege</text>
  </g>

  <path d="M212 324 H320" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="266" y="305" text-anchor="middle" class="flow">request</text>

  <path d="M568 324 H730" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="649" y="305" text-anchor="middle" class="flow">validated data</text>

  <path d="M910 274 H958" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="934" y="254" text-anchor="middle" class="flow">approved call</text>

  <path d="M820 322 V400 H838" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="790" y="380" text-anchor="middle" class="flow">authorized read</text>
</svg>
